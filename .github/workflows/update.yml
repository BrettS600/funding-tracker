# Weekly biotech funding tracker
# File must live at:  .github/workflows/update.yml
name: Weekly funding tracker

on:
  schedule:
    - cron: "16 13 * * 1"  # Mondays 13:16 UTC (~9:16 AM ET), after NIH's Sunday-night refresh
  workflow_dispatch: {}     # manual run button stays available
  push:                     # a code change rebuilds the page right away
    branches: [main]
    paths:
      - "funding_tracker.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
      - "data/nih_emails.csv"   # emails you record update the site right away
      - "data/nih_links.csv"

permissions:
  contents: write

# one run at a time: a code change during the Monday run waits its turn
concurrency:
  group: funding-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # latest main, so this run's commit lands on top of the last one

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Stage 1: pull the week's awards and publish the page right away (~2 min)
      - name: Update funding table
        run: python funding_tracker.py --skip-emails

      - name: Publish funding table
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly funding update"
          file_pattern: "data/* docs/*"

      # Stage 2: PI emails, then publications (only PIs not seen before), publish again
      - name: Look up PI emails and publications
        env:
          # Free keys, stored under Settings > Secrets and variables > Actions.
          # NCBI_API_KEY triples the PubMed lookup rate (optional).
          # OPENALEX_API_KEY is required for the publications popup ($1/day free tier).
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python funding_tracker.py --emails-only

      - name: Publish PI emails and publications
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "PI email and publication update"
          file_pattern: "data/* docs/*"
